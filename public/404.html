<!doctype html><html><head><meta charset="utf-8"><title>Redirecting…</title><script>
// GitHub Pages SPA fallback: send unknown paths to index.html, which restores the route.
var seg=1;var l=window.location;
l.replace(l.protocol+'//'+l.hostname+(l.port?':'+l.port:'')+l.pathname.split('/').slice(0,1+seg).join('/')+'/?/'+l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g,'~and~')+(l.search?'&'+l.search.slice(1).replace(/&/g,'~and~'):'')+l.hash);
</script></head></html>
